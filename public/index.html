<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>図鑑番号バトル</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#14232e;--pn:#1d3342;--ink:#eef4f7;--sub:#8fa9b8;--p0:#ffb703;--p1:#4cc9f0;--ok:#3ddc84;--ng:#ff5a5f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 "Zen Maru Gothic",system-ui,sans-serif;min-height:100vh}
#lobby,#over,#room{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:var(--bg);z-index:5;padding:20px;text-align:center}
#over,#room{display:none;overflow:auto}
#over{background:#14232ee8}
.set{display:grid;grid-template-columns:auto 110px;gap:10px 16px;align-items:center;text-align:left;background:var(--pn);padding:16px 20px;border-radius:14px}
.set input[type=number]{width:110px}.set input[type=checkbox]{width:22px;height:22px}
.set input:disabled{opacity:.55}
#rp{display:flex;flex-direction:column;gap:2px}
#rmsg{color:var(--sub);min-height:1.5em}
table{border-collapse:collapse;background:var(--pn);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
th,td{padding:8px 18px;text-align:center}th{text-align:left;color:var(--sub)}
td.w{color:var(--ok);font-weight:900}
.btns{display:flex;gap:10px}
.btns .sub2{background:#34566b;color:var(--ink)}
h1{font-weight:900;font-size:clamp(28px,6vw,48px);margin:0}
input,button{font:inherit;border-radius:10px;border:2px solid #34566b;background:#0f1b24;color:var(--ink);padding:10px 14px}
button{background:var(--p0);color:#1a1200;border:0;font-weight:900;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
#err{color:var(--ng);min-height:1.5em}
#game{display:none;grid-template-columns:1fr 1fr;gap:14px;padding:14px;max-width:1100px;margin:auto}
@media(max-width:760px){#game{grid-template-columns:1fr}}
.panel{position:relative;background:var(--pn);border:4px solid transparent;border-radius:16px;padding:14px;overflow:hidden;--c:var(--p0)}
.panel.p1{--c:var(--p1)}
.panel.active{border-color:var(--c)}
.head{display:flex;justify-content:space-between;align-items:baseline}
.nm{font-weight:900;color:var(--c)}
.timer{font-weight:900;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--ng);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.status{color:var(--sub);min-height:1.5em;margin:4px 0 8px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:#0f1b24;border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .2s}
.panel:not(.active) .card{opacity:.7}
.card img{width:96px;max-width:100%;image-rendering:pixelated;aspect-ratio:1}
.card b{font-size:13px}
.card input{width:84%;text-align:center;font-size:20px;font-weight:900;padding:6px}
.card input:disabled{opacity:.6}
.card.good{outline:2px solid var(--ok)}
.card.bad{outline:2px solid var(--ng)}
.reveal{font-weight:900;font-size:22px;color:var(--ok);min-height:1.4em}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
.row button{flex:1}
.log{margin-top:10px;height:84px;overflow:auto;font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:2px}
.log .ok{color:var(--ok)}.log .ng{color:var(--ng)}
.pop{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-weight:900;font-size:26px;white-space:nowrap;pointer-events:none;text-shadow:0 2px 12px #000;opacity:0}
.pop.show-ok{color:var(--ok);animation:pop 1.8s ease-out}
.pop.show-ng{color:var(--ng);animation:float 1.6s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes float{0%{opacity:1;transform:translate(-50%,-30%)}100%{opacity:0;transform:translate(-50%,-160%)}}
.panel.flash-ok{animation:flash 1s}
@keyframes flash{0%,60%{border-color:var(--ok);box-shadow:0 0 0 6px #3ddc8466,inset 0 0 40px #3ddc8455}100%{box-shadow:none}}
.panel.shake-ng{animation:shake .5s;border-color:var(--ng)}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){.panel,.pop,.timer{animation-duration:.01s!important}}
</style></head><body>

<div id="lobby">
  <h1>図鑑番号バトル</h1>
  <p>3匹の図鑑番号（1〜151）を答えて、手番を渡そう。持ち時間が先に尽きたら負け。</p>
  <input id="nm" placeholder="名前" maxlength="10">
  <input id="rm" placeholder="ルームID（友だちと同じIDを入力）" maxlength="20">
  <button id="go">対戦に参加</button>
  <div id="err"></div>
</div>

<div id="room">
  <h1 id="rt"></h1>
  <div id="rp"></div>
  <div class="set">
    <label for="sT">持ち時間（秒）</label><input id="sT" type="number" min="30" max="600">
    <label for="sP">誤答ペナルティ（秒）</label><input id="sP" type="number" min="0" max="60">
    <label for="sB">正解で時間を加算</label><input id="sB" type="checkbox">
    <label for="sBs">加算する秒数</label><input id="sBs" type="number" min="1" max="60">
  </div>
  <div id="rmsg"></div>
  <button id="rdy" disabled>準備OK</button>
</div>

<div id="game"></div>
<div id="over"><h1 id="ovt"></h1><table id="ovs"></table><div id="ovn"></div>
  <div class="btns"><button id="again">同じ相手でもう一度</button><button class="sub2" onclick="location.reload()">最初に戻る</button></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const NAMES="フシギダネ,フシギソウ,フシギバナ,ヒトカゲ,リザード,リザードン,ゼニガメ,カメール,カメックス,キャタピー,トランセル,バタフリー,ビードル,コクーン,スピアー,ポッポ,ピジョン,ピジョット,コラッタ,ラッタ,オニスズメ,オニドリル,アーボ,アーボック,ピカチュウ,ライチュウ,サンド,サンドパン,ニドラン♀,ニドリーナ,ニドクイン,ニドラン♂,ニドリーノ,ニドキング,ピッピ,ピクシー,ロコン,キュウコン,プリン,プクリン,ズバット,ゴルバット,ナゾノクサ,クサイハナ,ラフレシア,パラス,パラセクト,コンパン,モルフォン,ディグダ,ダグトリオ,ニャース,ペルシアン,コダック,ゴルダック,マンキー,オコリザル,ガーディ,ウインディ,ニョロモ,ニョロゾ,ニョロボン,ケーシィ,ユンゲラー,フーディン,ワンリキー,ゴーリキー,カイリキー,マダツボミ,ウツドン,ウツボット,メノクラゲ,ドククラゲ,イシツブテ,ゴローン,ゴローニャ,ポニータ,ギャロップ,ヤドン,ヤドラン,コイル,レアコイル,カモネギ,ドードー,ドードリオ,パウワウ,ジュゴン,ベトベター,ベトベトン,シェルダー,パルシェン,ゴース,ゴースト,ゲンガー,イワーク,スリープ,スリーパー,クラブ,キングラー,ビリリダマ,マルマイン,タマタマ,ナッシー,カラカラ,ガラガラ,サワムラー,エビワラー,ベロリンガ,ドガース,マタドガス,サイホーン,サイドン,ラッキー,モンジャラ,ガルーラ,タッツー,シードラ,トサキント,アズマオウ,ヒトデマン,スターミー,バリヤード,ストライク,ルージュラ,エレブー,ブーバー,カイロス,ケンタロス,コイキング,ギャラドス,ラプラス,メタモン,イーブイ,シャワーズ,サンダース,ブースター,ポリゴン,オムナイト,オムスター,カブト,カブトプス,プテラ,カビゴン,フリーザー,サンダー,ファイヤー,ミニリュウ,ハクリュー,カイリュー,ミュウツー,ミュウ".split(",");
const IMG=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
const $=id=>document.getElementById(id), socket=io();
let me=-1, turn=0, names=["1P","2P"], over=false;

$("go").onclick=()=>socket.emit("join",{room:$("rm").value,name:$("nm").value});
socket.on("err",m=>$("err").textContent=m);
socket.on("joined",({idx})=>{me=idx});
let myReady=false;
const IDS=["sT","sP","sB","sBs"];
const sendSet=()=>socket.emit("settings",{time:$("sT").value,penalty:$("sP").value,bonusOn:$("sB").checked,bonus:$("sBs").value});
IDS.forEach(id=>$(id).onchange=e=>{sendSet();if(e.target.type==="number")e.target.blur()});
$("rdy").onclick=()=>socket.emit("ready",!myReady);
$("again").onclick=()=>socket.emit("rematch");
socket.on("room_state",s=>{
  names=s.names.map((n,i)=>n||`${i+1}P`);
  if(s.phase==="playing"){$("room").style.display="none";return}
  $("lobby").style.display="none";$("over").style.display="none";
  $("game").style.display="none";$("game").innerHTML="";over=false;turn=0;
  $("room").style.display="flex";
  const host=me===0,st=s.settings;myReady=!!s.ready[me];
  $("rt").textContent=`ルーム「${$("rm").value.trim()}」`;
  $("rp").innerHTML=[0,1].map(p=>s.names[p]
    ?`<div>${p+1}P${p?"":"（ホスト）"}${p===me?"（あなた）":""}：${s.names[p]}　${s.ready[p]?"✔ 準備OK":"…未準備"}</div>`
    :`<div>${p+1}P：参加待ち…</div>`).join("");
  const put=(id,v,chk)=>{const e=$(id);if(document.activeElement===e)return;chk?e.checked=v:e.value=v};
  put("sT",st.time);put("sP",st.penalty);put("sB",st.bonusOn,1);put("sBs",st.bonus);
  IDS.forEach(id=>$(id).disabled=!host);$("sBs").disabled=!host||!st.bonusOn;
  $("rdy").disabled=s.count<2;$("rdy").textContent=myReady?"準備を取り消す":"準備OK";
  $("rmsg").textContent=s.count<2?"相手の参加を待っています":host?"設定を決めたら、両者が準備OKでスタート（設定を変えると準備はリセットされます）":"設定を確認して準備OKを押してください（設定はホストが決めます）";
});

function build(){
  $("lobby").style.display="none";$("room").style.display="none"; const g=$("game"); g.style.display="grid";
  g.innerHTML=[0,1].map(p=>`<section class="panel p${p}" id="P${p}">
    <div class="head"><span class="nm" id="n${p}"></span><span class="timer" id="t${p}">2:00</span></div>
    <div class="status" id="s${p}"></div>
    <div class="cards" id="c${p}"></div>
    <div class="row" id="r${p}"></div>
    <div class="log" id="l${p}"></div>
    <div class="pop" id="x${p}"></div></section>`).join("");
  $("r"+me).innerHTML=`<button id="sub">提出</button>`;
  $("sub").onclick=submit;
}
const fmt=t=>`${Math.floor(Math.max(t,0)/60)}:${String(Math.max(t,0)%60).padStart(2,"0")}`;
function times(t){[0,1].forEach(p=>{const e=$("t"+p);e.textContent=fmt(t[p]);e.classList.toggle("low",t[p]<=10&&t[p]>0&&p===turn)})}
function setTurn(t){
  turn=t;
  [0,1].forEach(p=>{
    $("P"+p).classList.toggle("active",p===t);
    $("s"+p).textContent=p===t?(p===me?"あなたの番です。3匹の図鑑番号を入力":`${names[p]}が考え中…`):"待機中";
    document.querySelectorAll(`#c${p} input`).forEach(i=>i.disabled=!(p===me&&p===t));
  });
  if($("sub"))$("sub").disabled=me!==t;
  const f=$(`i${me}_0`); if(me===t&&f)f.focus();
}
function cards(p,ids){
  $("c"+p).innerHTML=ids.map((id,k)=>`<div class="card"><img src="${IMG(id)}" alt=""><b>${NAMES[id-1]}</b>
    <input id="i${p}_${k}" inputmode="numeric" maxlength="3" autocomplete="off" ${p===me?"":"readonly"}>
    <div class="reveal" id="a${p}_${k}"></div></div>`).join("");
  if(p===me)[0,1,2].forEach(k=>{
    const i=$(`i${p}_${k}`);
    i.oninput=()=>{i.value=i.value.replace(/\D/g,"");socket.emit("typing",[0,1,2].map(j=>$(`i${p}_${j}`).value!==""))};
    i.onkeydown=e=>{if(e.key==="Enter"){k<2?$(`i${p}_${k+1}`).focus():submit()}};
  });
  setTurn(turn);
}
function submit(){
  if(me!==turn)return;
  const a=[0,1,2].map(k=>$(`i${me}_${k}`).value);
  if(a.some(v=>v===""))return $("s"+me).textContent="3つとも入力してください";
  socket.emit("submit",a);
}
function log(p,msg,cls){const l=$("l"+p);l.insertAdjacentHTML("afterbegin",`<div class="${cls}">${msg}</div>`)}
function fx(p,kind,text){
  const P=$("P"+p),x=$("x"+p);
  P.classList.remove("flash-ok","shake-ng");void P.offsetWidth;P.classList.add(kind==="ok"?"flash-ok":"shake-ng");
  x.className="pop";void x.offsetWidth;x.textContent=text;x.classList.add("show-"+kind);
}

socket.on("state",s=>{
  names=s.names.map((n,i)=>n||`${i+1}P`);
  if(s.names.length<2||!s.started)return;
  if(!$("P0"))build();
  [0,1].forEach(p=>{$("n"+p).textContent=`${names[p]}${p===me?"（あなた）":""}`;$("t"+p).dataset.v=s.time[p]});
  times(s.time);setTurn(s.turn);
});
socket.on("question_updated",({player,ids})=>{
  if(!$("P0"))build();
  cards(player,ids);
  log(player,"新しい3匹が出題されました");
  if(player!==me)$("s"+player).textContent=`${names[player]}が考え中…`;
});
socket.on("tick",({time,turn:t})=>{
  [0,1].forEach(p=>$("t"+p).dataset.v=time[p]);
  const changed=t!==turn; turn=t; times(time);
  if(changed)setTurn(t); // 手番が変わったときだけ更新（毎秒更新するとカーソルが飛ぶ）
});
socket.on("typing",({player,filled})=>{
  filled.forEach((f,k)=>{const i=$(`i${player}_${k}`);if(i)i.value=f?"●●":""});
  if(player===turn&&player!==me)$("s"+player).textContent=`${names[player]}が入力中… ${filled.map(f=>f?"●":"○").join("")}`;
});
socket.on("answer_result",r=>{
  const n=names[r.player];
  if(r.ok){
    r.ids.forEach((id,k)=>{$(`a${r.player}_${k}`).textContent=`#${id}`;$(`i${r.player}_${k}`).value=id});
    fx(r.player,"ok",r.bonus?`全問正解！ +${r.bonus}秒`:"全問正解！");
    log(r.player,`${n}が全問正解！${r.bonus?` +${r.bonus}秒`:""} 手番移動（${r.ids.join(", ")}）`,"ok");
    log(1-r.player,`${n}が全問正解（${r.ids.join(", ")}）`,"ok");
  }else{
    fx(r.player,"ng",`-${r.penalty}秒ペナルティ`);
    r.results.forEach((good,k)=>{
      const card=$(`i${r.player}_${k}`).closest(".card");
      card.classList.add(good?"good":"bad");
      $(`i${r.player}_${k}`).value=r.given[k]||"";
      $(`a${r.player}_${k}`).innerHTML=good?"✓ 正解":`✗ 正解は #${r.ids[k]}`;
      $(`a${r.player}_${k}`).style.color=good?"var(--ok)":"var(--ng)";
    });
    document.querySelectorAll(`#c${r.player} input`).forEach(i=>i.disabled=true);
    if(r.player===me)$("sub").disabled=true;
    $("s"+r.player).textContent="不正解… 3匹を入れ替えます";
    const bad=r.results.map((g,k)=>g?null:`#${r.ids[k]}`).filter(Boolean).join(", ");
    log(r.player,`${n}が誤答（${r.wrong}匹不正解）！ -${r.penalty}秒　正解: ${bad}`,"ng");
    log(1-r.player,`${n}が誤答（${r.wrong}匹不正解）-${r.penalty}秒`,"ng");
  }
});
socket.on("game_over",({winner,time,stats})=>{
  over=true;
  $("ovt").textContent=`${names[winner]}${winner===me?"（あなた）":""}の勝ち！`;
  const acc=i=>{const t=stats[i].ok+stats[i].ng;return t?Math.round(stats[i].ok/t*100)+"%":"-"};
  const row=(l,f)=>`<tr><th>${l}</th>${[0,1].map(i=>`<td class="${i===winner?"w":""}">${f(i)}</td>`).join("")}</tr>`;
  $("ovs").innerHTML=`<tr><th></th>${[0,1].map(i=>`<td class="${i===winner?"w":""}">${names[i]}${i===winner?" 🏆":""}</td>`).join("")}</tr>`
    +row("全問正解",i=>stats[i].ok+"回")+row("誤答",i=>stats[i].ng+"回")+row("正答率",acc)+row("残り時間",i=>fmt(time[i]));
  $("ovn").textContent="";$("again").style.display="";$("over").style.display="flex";
});
socket.on("opponent_left",()=>{
  if(!over){$("ovt").textContent="対戦終了";$("ovs").innerHTML=""}
  over=true;$("ovn").textContent="相手が退出しました";$("again").style.display="none";
  $("room").style.display="none";$("over").style.display="flex";
});
</script></body></html>
