<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>図鑑番号バトル</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#14232e;--pn:#1d3342;--ink:#eef4f7;--sub:#8fa9b8;--p0:#ffb703;--p1:#4cc9f0;--ok:#3ddc84;--ng:#ff5a5f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 "Zen Maru Gothic",system-ui,sans-serif;min-height:100vh}
#lobby,#over,#room{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:var(--bg);z-index:5;padding:20px;text-align:center}
#over,#room{display:none;overflow:auto}
#over{background:#14232ee8}
.set{display:grid;grid-template-columns:auto 110px;gap:10px 16px;align-items:center;text-align:left;background:var(--pn);padding:16px 20px;border-radius:14px}
.set input[type=number]{width:110px}.set input[type=checkbox]{width:22px;height:22px}
.set input:disabled{opacity:.55}
#rp{display:flex;flex-direction:column;gap:2px}
#rmsg{color:var(--sub);min-height:1.5em}
table{border-collapse:collapse;background:var(--pn);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
th,td{padding:8px 18px;text-align:center}th{text-align:left;color:var(--sub)}
#leave{position:fixed;bottom:10px;right:10px;z-index:10;display:none;background:#34566b;color:var(--ink);padding:6px 16px;font-size:14px}
body{padding-bottom:56px}
[hidden]{display:none!important}
.advsw{display:flex;align-items:center;gap:8px;font-weight:900}
#advOn{width:22px;height:22px}
.set.adv{display:flex;flex-direction:column;gap:10px}
.arow{display:grid;grid-template-columns:minmax(96px,1fr) minmax(84px,110px) minmax(84px,110px);gap:10px 14px;align-items:center}
.arow input[type=number]{width:100%}
.arow>div{display:flex;justify-content:center}
.ah{font-weight:900;color:var(--sub)}
.chk2{display:flex;flex-direction:column;gap:4px;font-size:14px}.chk2 label{display:flex;align-items:center;gap:6px}
#room.solo .arow{grid-template-columns:minmax(96px,1fr) minmax(84px,110px)}
#room.solo .vs,#room.solo .ns{display:none!important}
button.sub2{background:#34566b;color:var(--ink)}
#cd{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;background:#14232ef5}
#cdn{font-weight:900;font-size:min(40vw,40vh);line-height:1;color:var(--p0);animation:cdp 1s ease-out}
@keyframes cdp{from{transform:scale(1.7);opacity:0}to{transform:scale(1);opacity:1}}
#over{justify-content:safe center}
#ovl{display:flex;flex-direction:column;gap:8px;align-items:center}.lh{font-weight:900}
.lrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lc{background:var(--pn);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:108px;outline:3px solid transparent;font-size:13px}
.lc img{width:64px;image-rendering:pixelated}.lc .v{font-weight:900;font-size:15px}
.lc.good{outline-color:var(--ok)}.lc.bad{outline-color:var(--ng)}.lc.good .v{color:var(--ok)}.lc.bad .v{color:var(--ng)}
select{font:inherit;border-radius:10px;border:2px solid #34566b;background:#0f1b24;color:var(--ink);padding:8px}
select:disabled{opacity:.55}
.card .hint{min-height:1.4em;font-size:12px;color:var(--sub)}.card .hint b{font-size:20px;color:var(--c)}
.hb{color:var(--sub);font-weight:500;font-size:12px}
td.w{color:var(--ok);font-weight:900}
.btns{display:flex;gap:10px}
.btns .sub2{background:#34566b;color:var(--ink)}
h1{font-weight:900;font-size:clamp(28px,6vw,48px);margin:0}
input,button{font:inherit;border-radius:10px;border:2px solid #34566b;background:#0f1b24;color:var(--ink);padding:10px 14px}
button{background:var(--p0);color:#1a1200;border:0;font-weight:900;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
#err{color:var(--ng);min-height:1.5em}
#game{display:none;grid-template-columns:1fr 1fr;gap:14px;padding:14px;max-width:1100px;margin:auto}
@media(max-width:760px){#game{grid-template-columns:1fr}}
.panel{position:relative;background:var(--pn);border:4px solid transparent;border-radius:16px;padding:14px;overflow:hidden;--c:var(--p0)}
.panel.p1{--c:var(--p1)}
.panel.active{border-color:var(--c)}
.head{display:flex;justify-content:space-between;align-items:baseline}
.nm{font-weight:900;color:var(--c)}
.timer{font-weight:900;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--ng);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.status{color:var(--sub);min-height:1.5em;margin:4px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.card{background:#0f1b24;border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .2s}
.panel:not(.active) .card{opacity:.7}
.card img{width:96px;max-width:100%;image-rendering:pixelated;aspect-ratio:1}
.card b{font-size:13px}
.card input{width:84%;text-align:center;font-size:20px;font-weight:900;padding:6px}
.card input:disabled{opacity:.6}
.card.good{outline:2px solid var(--ok)}
.card.bad{outline:2px solid var(--ng)}
.reveal{font-weight:900;font-size:22px;color:var(--ok);min-height:1.4em}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
.row button{flex:1}
.log{margin-top:10px;height:84px;overflow:auto;font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:2px}
.log .ok{color:var(--ok)}.log .ng{color:var(--ng)}
.pop{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-weight:900;font-size:26px;white-space:nowrap;pointer-events:none;text-shadow:0 2px 12px #000;opacity:0}
.pop.show-ok{color:var(--ok);animation:pop 1.8s ease-out}
.pop.show-ng{color:var(--ng);animation:float 1.6s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes float{0%{opacity:1;transform:translate(-50%,-30%)}100%{opacity:0;transform:translate(-50%,-160%)}}
.panel.flash-ok{animation:flash 1s}
@keyframes flash{0%,60%{border-color:var(--ok);box-shadow:0 0 0 6px #3ddc8466,inset 0 0 40px #3ddc8455}100%{box-shadow:none}}
.panel.shake-ng{animation:shake .5s;border-color:var(--ng)}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){.panel,.pop,.timer{animation-duration:.01s!important}}

  /* バージョン表示用スタイル */
.version-tag {
  position: fixed;
  bottom: 8px;
  left: 8px;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.6);
  font-family: monospace, sans-serif;
  pointer-events: none;
  z-index: 9999;
}
</style></head><body>

<div id="lobby">
  <h1>図鑑番号バトル</h1>
  <p>3匹の図鑑番号を答える。持ち時間が先に尽きたら負け。</p>
  <input id="nm" placeholder="名前" maxlength="10">
  <input id="rm" placeholder="ルームID（半角英数字）" maxlength="20" inputmode="latin" autocapitalize="off" autocomplete="off" spellcheck="false">
  <button id="go">対戦に参加</button>
  <button id="solo" class="sub2">ひとり練習モード</button>
  <div id="err"></div>
  <div id="conn" style="color:var(--sub);font-size:14px"></div>
</div>

<div id="room">
  <h1 id="rt"></h1>
  <div id="rp"></div>
  <label class="advsw"><input id="advOn" type="checkbox">詳細設定を使用する</label>
  <div class="set" id="simpleArea">
    <label for="sT">持ち時間（秒）</label><input id="sT" type="number" min="30" max="600">
    <label for="sP">誤答ペナルティ（秒）</label><input id="sP" type="number" min="0" max="60">
    <label class="ns" for="sB">正解で時間を加算</label><input class="ns" id="sB" type="checkbox">
    <label class="ns" for="sBs">加算秒数</label><input class="ns" id="sBs" type="number" min="1" max="60">
    <label>出題範囲</label>
    <span class="chk2"><label><input id="sK" type="checkbox">カントー地方</label><label><input id="sJ" type="checkbox">ジョウト地方</label></span>
  </div>
  <div class="set adv" id="advArea" hidden></div>
  <div id="rmsg"></div>
  <button id="rdy" disabled>準備OK</button>
</div>

<div id="cd"><div id="cdn"></div><p>まもなく開始…</p></div>
<div id="game"></div>
<button id="leave">退出</button>
<div id="over"><h1 id="ovt"></h1><table id="ovs"></table><div id="ovl"></div><div id="ovn"></div>
  <div class="btns"><button id="again">同じ相手でもう一度</button><button class="sub2" onclick="location.reload()">最初に戻る</button></div></div>

  <div class="version-tag">v 0.0.2  @たくりん</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const NAMES="フシギダネ,フシギソウ,フシギバナ,ヒトカゲ,リザード,リザードン,ゼニガメ,カメール,カメックス,キャタピー,トランセル,バタフリー,ビードル,コクーン,スピアー,ポッポ,ピジョン,ピジョット,コラッタ,ラッタ,オニスズメ,オニドリル,アーボ,アーボック,ピカチュウ,ライチュウ,サンド,サンドパン,ニドラン♀,ニドリーナ,ニドクイン,ニドラン♂,ニドリーノ,ニドキング,ピッピ,ピクシー,ロコン,キュウコン,プリン,プクリン,ズバット,ゴルバット,ナゾノクサ,クサイハナ,ラフレシア,パラス,パラセクト,コンパン,モルフォン,ディグダ,ダグトリオ,ニャース,ペルシアン,コダック,ゴルダック,マンキー,オコリザル,ガーディ,ウインディ,ニョロモ,ニョロゾ,ニョロボン,ケーシィ,ユンゲラー,フーディン,ワンリキー,ゴーリキー,カイリキー,マダツボミ,ウツドン,ウツボット,メノクラゲ,ドククラゲ,イシツブテ,ゴローン,ゴローニャ,ポニータ,ギャロップ,ヤドン,ヤドラン,コイル,レアコイル,カモネギ,ドードー,ドードリオ,パウワウ,ジュゴン,ベトベター,ベトベトン,シェルダー,パルシェン,ゴース,ゴースト,ゲンガー,イワーク,スリープ,スリーパー,クラブ,キングラー,ビリリダマ,マルマイン,タマタマ,ナッシー,カラカラ,ガラガラ,サワムラー,エビワラー,ベロリンガ,ドガース,マタドガス,サイホーン,サイドン,ラッキー,モンジャラ,ガルーラ,タッツー,シードラ,トサキント,アズマオウ,ヒトデマン,スターミー,バリヤード,ストライク,ルージュラ,エレブー,ブーバー,カイロス,ケンタロス,コイキング,ギャラドス,ラプラス,メタモン,イーブイ,シャワーズ,サンダース,ブースター,ポリゴン,オムナイト,オムスター,カブト,カブトプス,プテラ,カビゴン,フリーザー,サンダー,ファイヤー,ミニリュウ,ハクリュー,カイリュー,ミュウツー,ミュウ,チコリータ,ベイリーフ,メガニウム,ヒノアラシ,マグマラシ,バクフーン,ワニノコ,アリゲイツ,オーダイル,オタチ,オオタチ,ホーホー,ヨルノズク,レディバ,レディアン,イトマル,アリアドス,クロバット,チョンチー,ランターン,ピチュー,ピィ,ププリン,トゲピー,トゲチック,ネイティ,ネイティオ,メリープ,モココ,デンリュウ,キレイハナ,マリル,マリルリ,ウソッキー,ニョロトノ,ハネッコ,ポポッコ,ワタッコ,エイパム,ヒマナッツ,キマワリ,ヤンヤンマ,ウパー,ヌオー,エーフィ,ブラッキー,ヤミカラス,ヤドキング,ムウマ,アンノーン,ソーナンス,キリンリキ,クヌギダマ,フォレトス,ノコッチ,グライガー,ハガネール,ブルー,グランブル,ハリーセン,ハッサム,ツボツボ,ヘラクロス,ニューラ,ヒメグマ,リングマ,マグマッグ,マグカルゴ,ウリムー,イノムー,サニーゴ,テッポウオ,オクタン,デリバード,マンタイン,エアームド,デルビル,ヘルガー,キングドラ,ゴマゾウ,ドンファン,ポリゴン2,オドシシ,ドーブル,バルキー,カポエラー,ムチュール,エレキッド,ブビィ,ミルタンク,ハピナス,ライコウ,エンテイ,スイクン,ヨーギラス,サナギラス,バンギラス,ルギア,ホウオウ,セレビィ".split(",");
const IMG=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
const $=id=>document.getElementById(id), socket=io();
// 接続状態の表示（無反応の原因を見分けるため）
let gotHello=false;
socket.on("hello",()=>{gotHello=true;$("conn").textContent="✔ サーバー接続OK（最新版）"});
socket.on("connect",()=>{$("conn").textContent="接続中…";setTimeout(()=>{if(!gotHello)$("conn").textContent="⚠ サーバーが旧版か別フォルダのものです。最新の server.js で起動し直してください"},1500)});
socket.on("connect_error",e=>{$("conn").textContent=`⚠ サーバーに接続できません（${e.message}）`});
socket.on("disconnect",()=>{$("conn").textContent="⚠ サーバーから切断されました"});
function trySend(ev,data){ // 送信後2秒返事がなければ理由を表示
  $("err").textContent="送信中…";socket.emit(ev,data);
  setTimeout(()=>{if($("err").textContent==="送信中…")$("err").textContent=gotHello?"サーバーから応答がありません":"サーバーが旧版のため応答がありません。server.js を最新版にして再起動してください"},2000);
}
// 全角→半角(NFKC)に直してから不要文字を除去。IME変換中は触らず、確定時に整える
const fixAscii=(v,re)=>String(v).normalize("NFKC").replace(re,"");
const normId=v=>fixAscii(v,/[^A-Za-z0-9]/g).toLowerCase();
function bindFix(el,fn,after){
  const run=()=>{const v=fn(el.value);if(v!==el.value)el.value=v;if(after)after()};
  el.addEventListener("input",e=>{if(!e.isComposing)run()});
  el.addEventListener("compositionend",run);
}
bindFix($("rm"),normId);
const showLeave=on=>$("leave").style.display=on?"block":"none";
$("leave").onclick=()=>{
  if($("game").style.display==="grid"&&!confirm("退出すると対戦が終了します。退出しますか？"))return;
  location.reload(); // 接続が切れ、サーバー側で退出処理される
};
let me=-1, turn=0, names=["1P","2P"], over=false;

$("go").onclick=()=>{
  const room=normId($("rm").value);$("rm").value=room;
  if(!room)return $("err").textContent="ルームIDは半角英数字で入力してください";
  trySend("join",{room,name:$("nm").value});
};
socket.on("err",m=>$("err").textContent=m);
socket.on("joined",({idx})=>{me=idx});
let myReady=false;
let isSolo=false;
// 詳細設定（1P/2P個別）の入力欄を生成： [キー, 表示名, 種類(n=数値/c=チェック/r=地方), min, max, ソロで非表示]
const ADV=[["time","持ち時間（秒）","n",30,600],["penalty","誤答ペナルティ（秒）","n",0,120],
  ["bonusOn","正解で時間を加算","c",0,0,1],["bonus","加算秒数","n",1,60,1],
  ["count","出題匹数（1〜5）","n",1,5],["showDigit","図鑑番号の下1桁を表示","c"],["regions","出題範囲","r"]];
const advCell=(n,key,type,min,max)=>type==="n"?`<input id="p${n}_${key}" type="number" min="${min}" max="${max}">`
  :type==="c"?`<input id="p${n}_${key}" type="checkbox">`
  :`<span class="chk2"><label><input id="p${n}_kanto" type="checkbox">カントー地方</label><label><input id="p${n}_johto" type="checkbox">ジョウト地方</label></span>`;
$("advArea").innerHTML=`<div class="arow ah"><span></span><div>1P<small id="an1"></small></div><div class="vs">2P<small id="an2"></small></div></div>`
  +ADV.map(([key,label,type,min,max,ns])=>`<div class="arow${ns?" ns":""}"><span>${label}</span><div>${advCell(1,key,type,min,max)}</div><div class="vs">${advCell(2,key,type,min,max)}</div></div>`).join("");

const PKEYS=["time","penalty","bonusOn","bonus","count","showDigit","kanto","johto"];
const ALLIDS=["advOn","sT","sP","sB","sBs","sK","sJ",...[1,2].flatMap(n=>PKEYS.map(k=>`p${n}_${k}`))];
const rd=id=>$(id).value, ck=id=>$(id).checked;
const readP=n=>({time:rd(`p${n}_time`),penalty:rd(`p${n}_penalty`),bonusOn:ck(`p${n}_bonusOn`),bonus:rd(`p${n}_bonus`),
  count:rd(`p${n}_count`),showDigit:ck(`p${n}_showDigit`),regions:{kanto:ck(`p${n}_kanto`),johto:ck(`p${n}_johto`)}});
const sendSet=()=>socket.emit("settings",{time:rd("sT"),penalty:rd("sP"),bonusOn:ck("sB"),bonus:rd("sBs"),
  regions:{kanto:ck("sK"),johto:ck("sJ")},advOn:ck("advOn"),p1:readP(1),p2:readP(2)});
ALLIDS.forEach(id=>$(id).onchange=e=>{sendSet();if(e.target.type==="number")e.target.blur()});
$("rdy").onclick=()=>socket.emit("ready",!myReady);
$("again").onclick=()=>socket.emit("rematch");
$("solo").onclick=()=>trySend("solo",{name:$("nm").value});
socket.on("countdown",({n})=>{ // 開始前の5秒カウントダウン
  $("cd").style.display="flex";const e=$("cdn");e.textContent=n;e.style.animation="none";void e.offsetWidth;e.style.animation="";
});
window.addEventListener("error",e=>{$("err").textContent=`画面エラー: ${e.message}`}); // 無反応に見える不具合の可視化
socket.on("room_state",s=>{
  $("err").textContent="";
  if(!s.settings||!s.settings.p1){ // 旧サーバーと新画面の組み合わせ
    $("err").textContent="サーバーが古い版です。最新の server.js に置き換えて、サーバーを再起動してください";return}
  names=s.names.map((n,i)=>n||`${i+1}P`);isSolo=!!s.solo;
  showLeave(true);
  if(s.phase==="playing"){$("room").style.display="none";return}
  if(s.phase==="countdown")return;
  $("cd").style.display="none";
  $("lobby").style.display="none";$("over").style.display="none";
  $("game").style.display="none";$("game").innerHTML="";over=false;turn=0;
  $("room").style.display="flex";$("room").classList.toggle("solo",isSolo);
  const host=me===0,st=s.settings;myReady=!!s.ready[me];
  $("rt").textContent=isSolo?"ひとり練習":`ルーム「${s.id}」`;
  $("rp").innerHTML=isSolo?`<div>${s.names[0]}さん：持ち時間が尽きるまで挑戦</div>`:[0,1].map(p=>s.names[p]
    ?`<div>${p+1}P${p?"":"（ホスト）"}${p===me?"（あなた）":""}：${s.names[p]}　${s.ready[p]?"✔ 準備OK":"…未準備"}</div>`
    :`<div>${p+1}P：参加待ち…</div>`).join("");
  const put=(id,v,chk)=>{const e=$(id);if(!chk&&document.activeElement===e)return;chk?e.checked=v:e.value=v};
  put("advOn",st.advOn,1);
  put("sT",st.time);put("sP",st.penalty);put("sB",st.bonusOn,1);put("sBs",st.bonus);put("sK",st.regions.kanto,1);put("sJ",st.regions.johto,1);
  [1,2].forEach(n=>{const v=st["p"+n];
    put(`p${n}_time`,v.time);put(`p${n}_penalty`,v.penalty);put(`p${n}_bonusOn`,v.bonusOn,1);put(`p${n}_bonus`,v.bonus);
    put(`p${n}_count`,v.count);put(`p${n}_showDigit`,v.showDigit,1);put(`p${n}_kanto`,v.regions.kanto,1);put(`p${n}_johto`,v.regions.johto,1);});
  ALLIDS.forEach(id=>$(id).disabled=!host);
  $("sBs").disabled=!host||!st.bonusOn;
  [1,2].forEach(n=>$(`p${n}_bonus`).disabled=!host||!st["p"+n].bonusOn);
  $("an1").textContent=isSolo?"":`（${s.names[0]||"1P"}）`;$("an2").textContent=`（${s.names[1]||"2P"}）`;
  $("simpleArea").hidden=st.advOn;$("advArea").hidden=!st.advOn; // 簡易/詳細の排他表示
  $("rdy").disabled=!isSolo&&s.count<2;$("rdy").textContent=isSolo?"スタート":(myReady?"準備を取り消す":"準備OK");
  $("rmsg").textContent=isSolo?"スタートすると5秒のカウントダウンのあと開始します"
    :s.count<2?"相手の参加を待っています":host?"設定を決めたら、両者が準備OKでスタート（設定を変えると準備はリセットされます）":"設定を確認して準備OKを押してください（設定はホストが決めます）";
});

function build(){
  $("lobby").style.display="none";$("room").style.display="none"; const g=$("game"); g.style.display="grid";
  g.innerHTML=[0,1].map(p=>`<section class="panel p${p}" id="P${p}">
    <div class="head"><span class="nm" id="n${p}"></span><span class="timer" id="t${p}">2:00</span></div>
    <div class="status" id="s${p}"></div>
    <div class="cards" id="c${p}"></div>
    <div class="row" id="r${p}"></div>
    <div class="log" id="l${p}"></div>
    <div class="pop" id="x${p}"></div></section>`).join("");
  g.style.gridTemplateColumns=isSolo?"minmax(0,560px)":"";g.style.justifyContent=isSolo?"center":"";
  if(isSolo)$("P1").style.display="none";
  $("r"+me).innerHTML=`<button id="sub">提出</button>`;
  $("sub").onclick=submit;
}
const fmt=t=>`${Math.floor(Math.max(t,0)/60)}:${String(Math.max(t,0)%60).padStart(2,"0")}`;
function times(t){[0,1].forEach(p=>{const e=$("t"+p);e.textContent=fmt(t[p]);e.classList.toggle("low",t[p]<=10&&t[p]>0&&p===turn)})}
function setTurn(t){
  turn=t;
  [0,1].forEach(p=>{
    $("P"+p).classList.toggle("active",p===t);
    $("s"+p).textContent=p===t?(p===me?"あなたの番です。図鑑番号を入力":`${names[p]}が考え中…`):"待機中";
    document.querySelectorAll(`#c${p} input`).forEach(i=>i.disabled=!(p===me&&p===t));
  });
  if($("sub"))$("sub").disabled=me!==t;
  const f=$(`i${me}_0`); if(me===t&&f)f.focus();
}
function cards(p,ids,hint){
  $("c"+p).innerHTML=ids.map((id,k)=>`<div class="card"><img src="${IMG(id)}" alt=""><b>${NAMES[id-1]}</b><div class="hint">${hint?`下1桁 <b>${hint[k]}</b>`:""}</div>
    <input id="i${p}_${k}" inputmode="numeric" maxlength="3" autocomplete="off" ${p===me?"":"readonly"}>
    <div class="reveal" id="a${p}_${k}"></div></div>`).join("");
  if(p===me)ids.forEach((_,k)=>{
    const i=$(`i${p}_${k}`);
    bindFix(i,v=>fixAscii(v,/\D/g).slice(0,3),()=>socket.emit("typing",ids.map((_,j)=>$(`i${p}_${j}`).value!=="")));
    i.onkeydown=e=>{if(e.isComposing||e.keyCode===229)return;if(e.key==="Enter"){k<ids.length-1?$(`i${p}_${k+1}`).focus():submit()}};
  });
  setTurn(turn);
}
function submit(){
  if(me!==turn)return;
  const a=[...document.querySelectorAll(`#c${me} input`)].map(i=>i.value);
  if(a.some(v=>v===""))return $("s"+me).textContent=`${a.length}匹すべて入力してください`;
  socket.emit("submit",a);
}
function log(p,msg,cls){const l=$("l"+p);l.insertAdjacentHTML("afterbegin",`<div class="${cls}">${msg}</div>`)}
function fx(p,kind,text){
  const P=$("P"+p),x=$("x"+p);
  P.classList.remove("flash-ok","shake-ng");void P.offsetWidth;P.classList.add(kind==="ok"?"flash-ok":"shake-ng");
  x.className="pop";void x.offsetWidth;x.textContent=text;x.classList.add("show-"+kind);
}

socket.on("state",s=>{
  names=s.names.map((n,i)=>n||`${i+1}P`);
  if((s.names.length<2&&!s.solo)||!s.started)return;
  isSolo=!!s.solo;$("cd").style.display="none";
  if(!$("P0"))build();
  const S=s.settings,tag=p=>{
    if(!S.advOn)return "";const e=S[p?"p2":"p1"];
    return ` <small class="hb">${e.count}匹 / -${e.penalty}秒${e.showDigit?" / 下1桁":""}</small>`;};
  [0,1].forEach(p=>{$("n"+p).innerHTML=`${names[p]}${p===me?"（あなた）":""}${tag(p)}`;$("t"+p).dataset.v=s.time[p]});
  times(s.time);setTurn(s.turn);
});
socket.on("question_updated",({player,ids,hint})=>{
  if(!$("P0"))build();
  cards(player,ids,hint);
  log(player,`新しい${ids.length}匹が出題されました`);
  if(player!==me)$("s"+player).textContent=`${names[player]}が考え中…`;
});
socket.on("tick",({time,turn:t})=>{
  [0,1].forEach(p=>$("t"+p).dataset.v=time[p]);
  const changed=t!==turn; turn=t; times(time);
  if(changed)setTurn(t); // 手番が変わったときだけ更新（毎秒更新するとカーソルが飛ぶ）
});
socket.on("typing",({player,filled})=>{
  filled.forEach((f,k)=>{const i=$(`i${player}_${k}`);if(i)i.value=f?"●●":""});
  if(player===turn&&player!==me)$("s"+player).textContent=`${names[player]}が入力中… ${filled.map(f=>f?"●":"○").join("")}`;
});
socket.on("answer_result",r=>{
  const n=names[r.player];
  if(r.ok){
    r.ids.forEach((id,k)=>{$(`a${r.player}_${k}`).textContent=`#${id}`;$(`i${r.player}_${k}`).value=id});
    fx(r.player,"ok",r.bonus?`全問正解！ +${r.bonus}秒`:"全問正解！");
    log(r.player,`${n}が全問正解！${r.bonus?` +${r.bonus}秒`:""} ${isSolo?"":" 手番移動"}（${r.ids.join(", ")}）`,"ok");
    log(1-r.player,`${n}が全問正解（${r.ids.join(", ")}）`,"ok");
  }else{
    fx(r.player,"ng",`-${r.penalty}秒ペナルティ`);
    r.results.forEach((good,k)=>{
      const card=$(`i${r.player}_${k}`).closest(".card");
      card.classList.add(good?"good":"bad");
      $(`i${r.player}_${k}`).value=r.given[k]||"";
      $(`a${r.player}_${k}`).innerHTML=good?"✓ 正解":`✗ 正解は #${r.ids[k]}`;
      $(`a${r.player}_${k}`).style.color=good?"var(--ok)":"var(--ng)";
    });
    document.querySelectorAll(`#c${r.player} input`).forEach(i=>i.disabled=true);
    if(r.player===me)$("sub").disabled=true;
    $("s"+r.player).textContent="不正解… 問題を入れ替えます";
    const bad=r.results.map((g,k)=>g?null:`#${r.ids[k]}`).filter(Boolean).join(", ");
    log(r.player,`${n}が誤答（${r.wrong}匹不正解）！ -${r.penalty}秒　正解: ${bad}`,"ng");
    log(1-r.player,`${n}が誤答（${r.wrong}匹不正解）-${r.penalty}秒`,"ng");
  }
});
function lastHtml(l){ // 最終問題の正誤を結果画面にはっきり表示
  if(!l)return "";
  const who=names[l.player]+(l.player===me?"（あなた）":""),w=l.kind==="wrong";
  const items=l.ids.map((id,k)=>{
    const ok=w&&l.results[k];
    return `<div class="lc ${w?(ok?"good":"bad"):""}"><img src="${IMG(id)}" alt=""><b>${NAMES[id-1]}</b>
      <span class="v">${w?(ok?"✓ 正解":"✗ 不正解"):"— 未回答"}</span>
      <span>答え: ${w?(l.given[k]||"未入力"):"—"}</span><span>正解: #${id}</span></div>`}).join("");
  return `<div class="lh">最終問題（${who}）：${w?"誤答でタイムアップ":"時間切れ"}</div><div class="lrow">${items}</div>`;
}
socket.on("game_over",({solo,winner,time,stats,last})=>{
  over=true;
  const cols=solo?[0]:[0,1],cls=i=>!solo&&i===winner?"w":"";
  $("ovt").textContent=solo?`終了！ 全問正解 ${stats[0].ok}回`:`${names[winner]}${winner===me?"（あなた）":""}の勝ち！`;
  const acc=i=>{const t=stats[i].ok+stats[i].ng;return t?Math.round(stats[i].ok/t*100)+"%":"-"};
  const row=(l,f)=>`<tr><th>${l}</th>${cols.map(i=>`<td class="${cls(i)}">${f(i)}</td>`).join("")}</tr>`;
  $("ovs").innerHTML=`<tr><th></th>${cols.map(i=>`<td class="${cls(i)}">${names[i]}${cls(i)?" 🏆":""}</td>`).join("")}</tr>`
    +row("全問正解",i=>stats[i].ok+"回")+row("誤答",i=>stats[i].ng+"回")+row("正答率",acc)+(solo?"":row("残り時間",i=>fmt(time[i])));
  $("ovl").innerHTML=lastHtml(last);
  showLeave(false);$("ovn").textContent="";$("again").textContent=solo?"もう一度挑戦":"同じ相手でもう一度";$("again").style.display="";$("over").style.display="flex";
});
socket.on("opponent_left",()=>{
  $("cd").style.display="none";
  if(!over){$("ovt").textContent="対戦終了";$("ovs").innerHTML="";$("ovl").innerHTML=""}
  over=true;showLeave(false);$("ovn").textContent="相手が退出しました";$("again").style.display="none";
  $("room").style.display="none";$("over").style.display="flex";
});
</script></body></html>
